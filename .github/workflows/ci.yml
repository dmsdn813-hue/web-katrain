name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Fix and audit dependencies
        run: npm audit fix && npm run audit
      - name: Verify
        run: npm run verify
      - name: Viewport and interaction checks
        id: viewport
        run: npm run test:viewport
      - name: Keep failed viewport screenshots
        if: failure() && steps.viewport.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: viewport-screenshots
          path: /tmp/web-katrain-viewport-check
          if-no-files-found: ignore
          retention-days: 7
