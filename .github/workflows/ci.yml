name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      # Vitest dev-only issues currently fail npm audit without affecting
      # production dependency scan. Keep the production security gate.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate
      - name: Typecheck and build
        run: npm run build
